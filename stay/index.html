<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#090c16">
<title>Confirm your stay · RoamWise</title>
<style>
:root{--bg:#090c16;--card:#141a2e;--ink:#f4f5fb;--mut:#a9aec6;--acc:#6d3df0;--ok:#2fbf71;--bad:#e5484d}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f5f6fb;--card:#fff;--ink:#14172b;--mut:#565b78}}
*{box-sizing:border-box}
body{margin:0;min-height:100dvh;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;display:grid;place-items:center;padding:16px}
main{width:100%;max-width:440px;background:var(--card);border-radius:18px;padding:22px 18px;box-shadow:0 10px 36px rgba(0,0,0,.25)}
h1{font-size:1.25rem;margin:0 0 6px}
p{color:var(--mut);margin:8px 0}
code{background:rgba(127,127,160,.18);padding:2px 8px;border-radius:8px;font-size:1rem}
.row{display:grid;gap:10px;margin-top:16px}
button{min-height:48px;border-radius:12px;border:0;font:600 1rem system-ui;cursor:pointer;color:#fff}
#yes{background:var(--ok)}#no{background:transparent;color:var(--ink);border:1px solid var(--mut)}
button:disabled{opacity:.5}
#msg{margin-top:14px;font-weight:600}
a{color:var(--acc)}
</style>
</head>
<body>
<main>
  <h1>Did you stay?</h1>
  <p id="intro">Tell RoamWise whether this stay happened. It takes one tap and helps keep hotels honest and listings real.</p>
  <p>Your booking code: <code id="code">—</code></p>
  <div class="row">
    <button id="yes" type="button">Yes, I stayed</button>
    <button id="no" type="button">No, I did not</button>
  </div>
  <p id="msg" role="status" aria-live="polite"></p>
  <p><a href="../">Back to RoamWise</a></p>
</main>
<script>
(function(){
  var KEY='rw_stay_codes_v1';
  var CODE_RE=/^RW-[ABCDEFGHJKLMNPQRSTUVWXYZ23456789]{6}$/;
  var $=function(id){return document.getElementById(id)};
  var code=(new URLSearchParams(location.search).get('c')||'').toUpperCase();
  var msg=function(t,bad){$('msg').textContent=t;$('msg').style.color=bad?'var(--bad)':'var(--ok)'};
  function load(){try{var v=JSON.parse(localStorage.getItem(KEY)||'[]');return Array.isArray(v)?v:[]}catch(e){return[]}}
  function workerUrl(){
    return fetch('https://firestore.googleapis.com/v1/projects/roamwisepro/databases/(default)/documents/config/app')
      .then(function(r){return r.ok?r.json():null})
      .then(function(d){
        var v=d&&d.fields&&d.fields.WORKER_URL&&d.fields.WORKER_URL.stringValue;
        var u=new URL(String(v||''));
        if(u.protocol!=='https:')throw 0;
        return u.href.replace(/\/+$/,'');
      });
  }
  if(!CODE_RE.test(code)){
    $('code').textContent='not valid';
    $('yes').disabled=$('no').disabled=true;
    msg('This link is not a valid RoamWise booking code.',true);
    return;
  }
  $('code').textContent=code;
  var rec=load().filter(function(x){return x&&x.code===code})[0];
  if(!rec||!rec.secret){
    $('yes').disabled=$('no').disabled=true;
    $('intro').textContent='Open this link in the same browser or app you used to message the hotel. That is how we know the confirmation really comes from you.';
    return;
  }
  function send(answer){
    $('yes').disabled=$('no').disabled=true;
    msg('Saving…');
    workerUrl().then(function(base){
      return fetch(base+'/stay/confirm',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({code:code,secret:rec.secret,stayed:answer})});
    }).then(function(r){
      if(!r.ok)throw new Error('http '+r.status);
      var list=load();list.forEach(function(x){if(x.code===code)x.answered=true});
      try{localStorage.setItem(KEY,JSON.stringify(list))}catch(e){}
      msg(answer==='yes'?'Thank you. Enjoy the memories!':'Thanks for letting us know.');
    }).catch(function(){
      $('yes').disabled=$('no').disabled=false;
      msg('Could not save. Please try again in a moment.',true);
    });
  }
  $('yes').onclick=function(){send('yes')};
  $('no').onclick=function(){send('no')};
})();
</script>
</body>
</html>
