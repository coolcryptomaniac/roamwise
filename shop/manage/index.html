<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Shop catalogue · RoamWise founders</title>
<link rel="icon" href="/assets/img/roamwise-logo-176.webp">
<script defer src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script defer src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script defer src="manage.js?v=1"></script>
<style>
@font-face{font-family:Outfit;src:url(/assets/fonts/outfit-latin-wght.woff2) format('woff2');font-weight:100 900;font-display:swap}
:root{--line:rgba(201,173,220,.2);--t1:#F2EEF7;--t2:#B9B4CC;--t3:#7E7A94;--gold:#E8BA6C}
*{box-sizing:border-box}html,body{margin:0;background:#07090F;color:var(--t1);font:400 14.5px/1.5 Outfit,system-ui,sans-serif}
main{max-width:980px;margin:0 auto;padding:16px 14px 48px;display:grid;gap:14px}
header{display:flex;align-items:center;gap:10px;justify-content:space-between}
.card{background:linear-gradient(160deg,rgba(40,30,78,.55),rgba(14,14,28,.88));border:1px solid var(--line);border-radius:20px;padding:16px}
h1{font-size:22px;margin:0}h2{font-size:17px;margin:0 0 10px}.muted{color:var(--t2)}.small{font-size:12px;color:var(--t3)}
input,select,textarea,button{font:600 14px Outfit,system-ui;border-radius:12px;border:1px solid var(--line);background:rgba(10,10,22,.7);color:var(--t1);min-height:42px;padding:0 12px;width:100%}
textarea{min-height:70px;padding:10px 12px;font-weight:500}
button{cursor:pointer;width:auto}.gold{background:var(--gold);color:#140f05;border:0;font-weight:800}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}label{display:grid;gap:4px;font-size:12.5px;color:var(--t2)}
table{width:100%;border-collapse:collapse;font-size:13.5px}td,th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
td img{width:44px;height:44px;object-fit:cover;border-radius:8px}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;border:1px solid var(--line)}.live{color:#5fd3a0}.vote{color:var(--gold)}.draft{color:var(--t3)}
.var{display:grid;grid-template-columns:1fr 1fr 1.4fr auto;gap:6px;margin-top:6px}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#1d1a33;border:1px solid var(--line);padding:10px 16px;border-radius:12px;display:none}
</style>
</head>
<body>
<main>
  <header><h1>Shop catalogue</h1><button id="out" hidden>Sign out</button></header>
  <div id="app"><section class="card"><p class="muted">Loading…</p></section></div>
</main>
<div id="toast" role="status"></div>
</body>
</html>
