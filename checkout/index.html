<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RoamWise · Secure checkout</title><style>body{margin:0;background:#100e23;color:#ffecdc;font:16px system-ui}main{max-width:560px;margin:35px auto;padding:24px;border:1px solid #a68d79;border-radius:20px;background:#281a3c}h1{color:#ffdaa0}label{display:block;margin:14px 0}input,select{display:block;width:100%;padding:12px;box-sizing:border-box;border-radius:8px}button{background:#f6cb83;border:0;border-radius:18px;padding:15px;font-weight:800}button:disabled{opacity:.5}a{color:#f6ca87}.note{font-size:13px;color:#e3d0dc}</style></head><body><main><a href="/">← RoamWise</a><h1>🔒 RoamWise checkout</h1><p id="item"></p><p id="amount"></p><p class="note" id="scope">Final delivery costs and inventory must be approved before checkout. Package requests are not confirmed hotel stays.</p><form id="form"><label>Full name<input id="name" required maxlength="80" autocomplete="name"></label><label>Phone<input id="phone" required inputmode="tel" autocomplete="tel"></label><label>Email<input id="email" required type="email" autocomplete="email"></label><label>Payment<select id="mode"><option value="full">Pay full amount</option><option value="advance">Pay confirmed advance</option></select></label><label><input id="terms" type="checkbox" required style="width:auto;display:inline"> I agree to the approved total, service scope and <a href="/escapes/#booking-policy">refund policy</a>.</label><button type="submit" id="pay" disabled>Secure checkout pending activation</button></form><p role="status" id="msg">No money has been taken.</p></main><script src="https://sdk.cashfree.com/js/v3/cashfree.js"></script><script>
(function(){const p=new URLSearchParams(location.search),sku=p.get('sku')||'',known={wedding_discovery:['Venue discovery',3000],wedding_priority:['Priority wedding planning',5000],aipan_scarf:['Aipan scarf',349],almora_hoodie:['Almora After Dark hoodie',1999],mandala_headband:['Mandala headband',199]};const item=known[sku];document.getElementById('item').textContent=item?item[0]:'Custom travel / group booking';document.getElementById('amount').textContent=item?'Item price ₹'+item[1].toLocaleString('en-IN')+'; shipping/taxes may require confirmation':'Exact amount is set by the approved RoamWise quote. No arbitrary guest-entered amount is accepted.';document.getElementById('mode').disabled=Boolean(item);const worker=window.ROAMWISE_PAYMENT_WORKER_URL||'';const ready=/^https:\/\/[a-z0-9.-]+\/v1\/payments\/create$/i.test(worker);const button=document.getElementById('pay');if(ready&&item&&(!['aipan_scarf','almora_hoodie','mandala_headband'].includes(sku))){button.disabled=false;button.textContent='Pay securely with Cashfree'}document.getElementById('form').addEventListener('submit',async function(e){e.preventDefault();if(button.disabled||!ready)return;button.disabled=true;const msg=document.getElementById('msg');msg.textContent='Creating secure Cashfree order…';try{const key=crypto.randomUUID(),phone=document.getElementById('phone').value.replace(/[^\d+]/g,'');if(!/^\+?\d{10,15}$/.test(phone))throw Error('phone');const r=await fetch(worker,{method:'POST',headers:{'content-type':'application/json','x-idempotency-key':key},body:JSON.stringify({productId:sku,method:'upi',currency:'INR',country:'IN',customer:{id:'rw_'+key.slice(0,20),phone,email:document.getElementById('email').value}})});const v=await r.json();if(!r.ok||v.provider!=='cashfree'||!v.checkout?.paymentSessionId)throw Error('payment_unavailable');if(!window.Cashfree)throw Error('sdk_unavailable');await window.Cashfree({mode:v.checkout.environment==='production'?'production':'sandbox'}).checkout({paymentSessionId:v.checkout.paymentSessionId,redirectTarget:'_self'});msg.textContent='Payment initiated; confirmation requires provider verification.'}catch(ex){msg.textContent='Checkout unavailable or configuration incomplete. No successful payment recorded.'}finally{button.disabled=false}})})();
</script></body></html>
