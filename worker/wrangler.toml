name = "roamwise-api"
main = "worker.js"
compatibility_date = "2026-01-01"

# ---------------------------------------------------------------------------
# CRON — one schedule, one handler. Runs daily 05:30 UTC (11:00 IST).
# News refreshes every run; events refresh on Mondays only (see worker.js).
# ---------------------------------------------------------------------------
[triggers]
crons = ["30 5 * * *"]

# ---------------------------------------------------------------------------
# KV — REQUIRED for /news and /events to cache anything.
# Without it the Worker still runs, but those endpoints return empty.
#   npx wrangler kv namespace create RW_KV
# Paste the printed id below and UNCOMMENT all three lines.
# ---------------------------------------------------------------------------
[[kv_namespaces]]
binding = "RW_KV"
id = "be31e0935be843219cea1edf2203877b"   # <-- the ONLY line you edit in this file

# ---------------------------------------------------------------------------
# SECRETS — never written here. Set each with wrangler:
#
#   npx wrangler secret put GROQ_API_KEY      # optional: enables /ai proxy
#   npx wrangler secret put GROQ_MODEL        # required with GROQ_API_KEY; founder-selected model
#   npx wrangler secret put OPENAI_API_KEY    # optional: AI CA provider
#   npx wrangler secret put OPENAI_MODEL      # model selected by founder; no browser exposure
#   npx wrangler secret put ANTHROPIC_API_KEY # optional: AI CA provider
#   npx wrangler secret put ANTHROPIC_MODEL   # model selected by founder; no browser exposure
#   npx wrangler secret put TICKETMASTER_KEY  # optional: enables /events
#   npx wrangler secret put REFRESH_TOKEN     # recommended: protects /events/refresh
#   npx wrangler secret put CASHFREE_APP_ID       # optional: enables /cashfree/order
#   npx wrangler secret put CASHFREE_SECRET_KEY   # optional: enables /cashfree/order
#   npx wrangler secret put FIREBASE_SERVICE_ACCOUNT_JSON  # enables /push/send and authenticated partner checkout
#
# All are OPTIONAL. /health tells you which are actually configured. See
# CASHFREE-INTEGRATION-SETUP.md for the exact Cashfree setup walkthrough
# (sandbox vs live, the Firestore config flag that turns it on for users) and
# PUSH-NOTIFICATIONS-SETUP.md for the push-notification setup walkthrough
# (FIREBASE_SERVICE_ACCOUNT_JSON is the full service-account JSON key file's
# contents, pasted as one secret value — never a plaintext value in this
# file, and never shipped to the browser; see worker/lib/service-account.js).
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# CASHFREE — non-secret config only. CASHFREE_ENV picks the Order Create API
# base URL (sandbox.cashfree.com vs api.cashfree.com); it is a config choice,
# not a secret, so it lives here, not in `wrangler secret put`.
# The founder confirmed the Worker already holds production credentials.
# Admin config/app is a separate gate: live checkout remains unavailable
# unless PAYMENT_PROVIDER=cashfree and CASHFREE_ENVIRONMENT=live there too.
# ---------------------------------------------------------------------------
[vars]
CASHFREE_ENV = "live"
# Cashfree PG documents x-api-version 2025-01-01. Do not use a guessed future
# date: an unsupported API version can prevent order creation.
CASHFREE_API_VERSION = "2025-01-01"
# Managed AI is fail-closed. Leave false until AI_USAGE KV, GROQ_MODEL and
# FIREBASE_SERVICE_ACCOUNT_JSON are configured and the authenticated flow has
# been tested. Client-submitted model/token-limit values are ignored.
MANAGED_AI_ENABLED = "false"
AI_MAX_PROMPT_CHARS = "4000"
AI_MAX_OUTPUT_TOKENS = "700"
# Admin-only AI CA provider preference. API keys/models remain Worker secrets.
# auto tries OpenAI, then Anthropic, then the existing Groq provider.
AI_CA_PROVIDER = "auto"
# PAYMENT_RETURN_URL = "https://roamwise.co.in/partner/"   # optional fallback return URL

# Separate monthly allowance meter for /ai. Create it with:
#   npx wrangler kv namespace create AI_USAGE
# then uncomment and paste the real id. Managed AI stays unavailable without it.
# [[kv_namespaces]]
# binding = "AI_USAGE"
# id = "PASTE_AI_USAGE_ID_HERE"

# ---------------------------------------------------------------------------
# R2 — OPTIONAL object storage. No route in worker.js uses this yet; this is
# scaffolding for future use (e.g. server-side PDF caching — see
# CLOUDFLARE-MIGRATION-SETUP.md section D). Uncomment once a real bucket
# exists:
#
# [[r2_buckets]]
# binding = "RW_BUCKET"
# bucket_name = "roamwise-data"
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# WORKERS AI — OPTIONAL. No route in worker.js calls this yet; this is
# example syntax only for future use (e.g. free-tier strategy).
# Uncomment to bind Workers AI to `env.AI`:
#
# [ai]
# binding = "AI"
# ---------------------------------------------------------------------------
