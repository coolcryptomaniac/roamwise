name = "roamwise-api"
main = "worker.js"
compatibility_date = "2026-01-01"

# ---------------------------------------------------------------------------
# CRON — one schedule, one handler. Runs daily 05:30 UTC (11:00 IST).
# News refreshes every run; events refresh on Mondays only (see worker.js).
# ---------------------------------------------------------------------------
[triggers]
crons = ["30 5 * * *"]

# ---------------------------------------------------------------------------
# KV — REQUIRED for /news and /events to cache anything.
# Without it the Worker still runs, but those endpoints return empty.
#   npx wrangler kv namespace create RW_KV
# Paste the printed id below and UNCOMMENT all three lines.
# ---------------------------------------------------------------------------
[[kv_namespaces]]
binding = "RW_KV"
id = "PASTE_THE_ID_HERE"   # <-- the ONLY line you edit in this file

# ---------------------------------------------------------------------------
# SECRETS — never written here. Set each with wrangler:
#
#   npx wrangler secret put GROQ_API_KEY      # optional: enables /ai proxy
#   npx wrangler secret put TICKETMASTER_KEY  # optional: enables /events
#   npx wrangler secret put REFRESH_TOKEN     # recommended: protects /events/refresh
#   npx wrangler secret put CASHFREE_APP_ID       # optional: enables /cashfree/order
#   npx wrangler secret put CASHFREE_SECRET_KEY   # optional: enables /cashfree/order
#
# All are OPTIONAL. /health tells you which are actually configured. See
# CASHFREE-INTEGRATION-SETUP.md for the exact Cashfree setup walkthrough
# (sandbox vs live, the Firestore config flag that turns it on for users).
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# CASHFREE — non-secret config only. CASHFREE_ENV picks the Order Create API
# base URL (sandbox.cashfree.com vs api.cashfree.com); it is a config choice,
# not a secret, so it lives here, not in `wrangler secret put`. Defaults to
# sandbox — flip to "live" only after end-to-end sandbox testing (see
# CASHFREE-INTEGRATION-SETUP.md).
# ---------------------------------------------------------------------------
[vars]
CASHFREE_ENV = "sandbox"
# CASHFREE_API_VERSION = "2023-08-01"   # optional override; handler defaults to this
# PAYMENT_RETURN_URL = "https://roamwise.co.in/"   # optional: Cashfree order_meta.return_url

# ---------------------------------------------------------------------------
# R2 — OPTIONAL object storage. No route in worker.js uses this yet; this is
# scaffolding for future use (e.g. server-side PDF caching — see
# CLOUDFLARE-MIGRATION-SETUP.md section D). Uncomment once a real bucket
# exists:
#   1. Cloudflare dashboard -> R2 -> Create bucket -> name it (e.g. "roamwise-data")
#   2. Uncomment the block below (bucket_name must match exactly what you created)
#
# [[r2_buckets]]
# binding = "RW_BUCKET"
# bucket_name = "roamwise-data"
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# WORKERS AI — OPTIONAL. No route in worker.js calls this yet; this is
# example syntax only, for future use (see CLOUDFLARE-MIGRATION-SETUP.md
# section E for the free-tier strategy before actually enabling this).
# Uncomment to bind Workers AI to this Worker as `env.AI`:
#
# [ai]
# binding = "AI"
# ---------------------------------------------------------------------------
