# ============================================================================
# Ailon Tusk — daily self-improvement
# ============================================================================
# WHAT THIS HONESTLY DOES: it does not "train" a model. Nobody fine-tunes an
# LLM nightly from a GitHub Action, and any tool claiming that is misleading
# you. What it DOES do is real and useful:
#
#   1. reads the questions users actually asked (exported from the app)
#   2. finds the ones Tusk answered badly — no place matched, or a fallback
#   3. resolves those place names against OpenStreetMap ONCE
#   4. writes them into tusk-learned.js, which ships with the app
#
# Net effect: every day Tusk recognises more of the places YOUR users ask
# about, offline, with no API call at question time. That is learning in the
# only sense that matters here — it gets better because it was used.
#
# Runs on GitHub's free tier: ~2 minutes a day.
# ============================================================================
name: Tusk daily learning

on:
  schedule:
    - cron: '30 1 * * *'      # 07:00 IST
  workflow_dispatch:           # or run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  learn:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Collect unresolved place queries
        run: |
          # misses.txt is written by the app (admin → export unresolved).
          # If it isn't there yet, this is a no-op rather than a failure.
          test -f data/misses.txt || { echo "no misses file yet — nothing to learn"; exit 0; }
          wc -l data/misses.txt

      - name: Resolve them against OpenStreetMap
        run: |
          test -f data/misses.txt || exit 0
          : > data/resolved.json
          echo "{" >> data/resolved.json
          first=1
          # OSM policy: max 1 request/second. sleep 1.2 keeps us well inside it.
          while read -r q; do
            [ -z "$q" ] && continue
            enc=$(printf '%s' "$q" | jq -sRr @uri)
            r=$(curl -s -A "RoamWise/1.0 (roamwise.co.in)" \
                 "https://nominatim.openstreetmap.org/search?format=json&limit=1&q=$enc")
            name=$(echo "$r" | jq -r '.[0].name // empty')
            lat=$(echo "$r" | jq -r '.[0].lat // empty')
            lon=$(echo "$r" | jq -r '.[0].lon // empty')
            if [ -n "$name" ]; then
              [ $first -eq 0 ] && echo "," >> data/resolved.json
              printf '"%s":{"name":"%s","lat":%s,"lon":%s}' "$q" "$name" "$lat" "$lon" >> data/resolved.json
              first=0
            fi
            sleep 1.2
          done < data/misses.txt
          echo "}" >> data/resolved.json
          jq . data/resolved.json > /dev/null && echo "valid JSON"

      - name: Write tusk-learned.js
        run: |
          test -s data/resolved.json || exit 0
          {
            echo "/* AUTO-GENERATED by .github/workflows/tusk-daily.yml — do not edit by hand."
            echo "   Places real users asked about that Tusk did not know, resolved once"
            echo "   against OpenStreetMap so they work offline from now on."
            echo "   Last updated: $(date -u +%Y-%m-%d)  */"
            printf 'window.RW_LEARNED_PLACES = '
            cat data/resolved.json
            echo ";"
          } > tusk-learned.js
          node --check tusk-learned.js && echo "tusk-learned.js is valid JS"

      - name: Commit if anything changed
        run: |
          git config user.name  "tusk-bot"
          git config user.email "bot@roamwise.co.in"
          git add tusk-learned.js data/resolved.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "Tusk: learned $(jq 'length' data/resolved.json 2>/dev/null || echo 0) new places"
          git push || echo "nothing to push"
