name: Deploy Worker (manual)

# Press "Run workflow" from the GitHub app/site. Deploys worker/ to Cloudflare
# using worker/wrangler.toml (KV, AI binding and vars are all declared there;
# secrets already set on the Worker are kept).
# Repo secrets needed (never paste them in chat):
#   CLOUDFLARE_API_TOKEN   token from the "Edit Cloudflare Workers" template
#   CLOUDFLARE_ACCOUNT_ID  Cloudflare dashboard sidebar

# Also runs by itself when worker/ code changes on main. Safety net:
#   1. a --dry-run bundle (parses and links every file) BEFORE deploying;
#      if it fails nothing is deployed and the live Worker is untouched.
#   2. after deploying, /health is checked 3 times; if it still fails the
#      previous Worker version is restored automatically (wrangler rollback).
# Cost: ~1 minute of Actions time, only when worker/ files change.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - '.github/workflows/deploy-worker.yml'

permissions:
  contents: read

concurrency:
  group: worker-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Require Cloudflare secrets
        env:
          T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          A: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$T" ] || [ -z "$A" ]; then
            echo "::error::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in repository Actions secrets."
            exit 1
          fi
      - name: Pre-flight (syntax + dry-run bundle)
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --dry-run --outdir /tmp/worker-dry
      # Maintain existing secrets BEFORE code deployment so rollback restores the previous application revision.
      - name: Team email list for the daily travel-safety digest
        # ALERT_TEAM_EMAILS (comma list) if set, else TO_EMAIL. Skipped when neither exists.
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TEAM: ${{ secrets.ALERT_TEAM_EMAILS || secrets.TO_EMAIL }}
        run: |
          if [ -z "$TEAM" ]; then echo "no ALERT_TEAM_EMAILS / TO_EMAIL secret: digest email skipped"; exit 0; fi
          printf '%s' "$TEAM" | npx --yes wrangler@4 secret put ALERT_TEAM_EMAILS || echo "::warning::could not set ALERT_TEAM_EMAILS"
      - name: Wallet link secret (created once, never printed)
        # Signs wallet and booking-decision links. Generated on first deploy only; an existing secret is kept.
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if npx --yes wrangler@4 secret list 2>/dev/null | grep -q '"WALLET_LINK_SECRET"'; then echo "WALLET_LINK_SECRET already set"; exit 0; fi
          openssl rand -hex 32 | npx --yes wrangler@4 secret put WALLET_LINK_SECRET >/dev/null && echo "WALLET_LINK_SECRET created" || echo "::warning::could not set WALLET_LINK_SECRET"
      - name: Amor rate-book key (created once, never printed)
        # Private key that opens worker/data/amor-rates.sealed.json (supplier net rates). Generated on the first deploy
        # only; an existing key is kept. Its public half is served at /stays/rates-key for tools/amor-rates-seal.mjs.
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if npx --yes wrangler@4 secret list 2>/dev/null | grep -q '"AMOR_RATES_KEY"'; then echo "AMOR_RATES_KEY already set"; exit 0; fi
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 2>/dev/null | npx --yes wrangler@4 secret put AMOR_RATES_KEY >/dev/null && echo "AMOR_RATES_KEY created" || echo "::warning::could not set AMOR_RATES_KEY"
      - name: Storage bindings (R2 records + media, D1 database)
        # KV = caches and short-lived state; D1 = sales register; R2 = permanent files (books, backups, media).
        # Creates the private bucket and the database on first run, applies D1 migrations, and adds the bindings
        # to wrangler.toml for this deploy only. If anything here fails, the Worker deploys without them
        # (lib/records.js is a no-op without bindings), so a storage hiccup never blocks a release.
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          W="npx --yes wrangler@4"
          $W r2 bucket create roamwise-records >/dev/null 2>&1; $W r2 bucket create roamwise-media >/dev/null 2>&1
          if $W r2 bucket list 2>/dev/null | grep -q 'roamwise-records'; then
            printf '\n[[r2_buckets]]\nbinding = "RECORDS"\nbucket_name = "roamwise-records"\n\n[[r2_buckets]]\nbinding = "MEDIA"\nbucket_name = "roamwise-media"\n' >> wrangler.toml
            echo "R2 bound: RECORDS (private), MEDIA"
          else echo "::warning::R2 buckets unavailable (token may lack R2 permission); deploying without R2"; fi
          id() { $W d1 list --json 2>/dev/null | python3 -c "import sys,json;print(next((d.get('uuid') or d.get('database_id') or '' for d in json.load(sys.stdin) if d.get('name')=='roamwise-db'),''))" 2>/dev/null; }
          DB=$(id); [ -z "$DB" ] && $W d1 create roamwise-db >/dev/null 2>&1 && DB=$(id)
          if [ -n "$DB" ]; then
            printf '\n[[d1_databases]]\nbinding = "DB"\ndatabase_name = "roamwise-db"\ndatabase_id = "%s"\nmigrations_dir = "migrations"\n' "$DB" >> wrangler.toml
            if $W d1 migrations apply roamwise-db --remote; then echo "D1 bound and migrated"; else echo "::warning::D1 migrations failed"; fi
          else echo "::warning::D1 unavailable (token may lack D1 permission); deploying without D1"; fi
          exit 0
      - name: Deploy
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy
      - name: Health (3 tries)
        id: health
        run: |
          for i in 1 2 3; do
            if curl -fsS https://roamwise-api.founder-f53.workers.dev/health; then exit 0; fi
            sleep 10
          done
          exit 1
      - name: Smoke MCP discovery + itineraries (read-only)
        id: mcp_smoke
        shell: bash
        run: |
          python3 - <<'PY'
          import json, subprocess
          root = 'https://roamwise-api.founder-f53.workers.dev'
          def call(path, payload=None, extra_headers=None):
              command = ['curl','-fsS','--connect-timeout','6','--max-time','25','--retry','2','--retry-delay','2',
                         '-H','Accept: application/json, text/event-stream']
              if payload is not None:
                  command += ['-X','POST','-H','Content-Type: application/json','--data-binary','@-']
              for header in (extra_headers or []): command += ['-H',header]
              result = subprocess.run(command + [root + path], input=json.dumps(payload) if payload is not None else None,
                                      text=True, capture_output=True, timeout=90)
              if result.returncode:
                  raise RuntimeError('Public API smoke failed at ' + path + ': ' + result.stderr[:280])
              try: return json.loads(result.stdout)
              except ValueError: raise RuntimeError('Invalid JSON from public API at ' + path)
          def rpc(method, params=None):
              result = call('/mcp', {'jsonrpc':'2.0','id':1,'method':method,**({'params':params} if params is not None else {})})
              assert 'error' not in result, 'MCP request failed: ' + method
              return result['result']
          def rpc_modern(method, params=None):
              meta={'io.modelcontextprotocol/protocolVersion':'2026-07-28',
                    'io.modelcontextprotocol/clientCapabilities':{}}
              enriched=dict(params or {})
              enriched['_meta']=meta
              payload={'jsonrpc':'2.0','id':2,'method':method,'params':enriched}
              headers=['MCP-Protocol-Version: 2026-07-28','Mcp-Method: '+method]
              if method=='tools/call': headers += ['Mcp-Name: '+str(enriched.get('name',''))]
              result=call('/mcp',payload,headers)
              assert 'error' not in result, 'MCP 2026-07-28 failed: '+method
              return result['result']
          # The exact text token is public domain ownership proof, not a secret.
          verify=subprocess.run(['curl','-fsS','--max-time','20',
            root+'/.well-known/openai-apps-challenge'],
            text=True,capture_output=True,timeout=35)
          assert verify.returncode==0, 'OpenAI domain challenge endpoint unreachable'
          assert verify.stdout=='zW7Q6A_aJzxxiLSyCOKhxrWV4RfwXYg9Fr9_AjbOeIE', 'OpenAI domain token mismatch'
          modern_list=rpc_modern('tools/list')
          modern_resources=rpc_modern('resources/list')
          modern_read=rpc_modern('resources/read',{'uri':modern_resources['resources'][0]['uri']})
          for result in (modern_list,modern_resources,modern_read):
              assert result['ttlMs']==60000 and result['cacheScope']=='public', 'MCP cache fields missing'
          assert 'RoamWise' in modern_read['contents'][0]['text'], 'Modern UI resource missing'
          listing = call('/v1/discovery/search?q=Almora&type=stay')
          assert listing['count'] >= 2 and listing['cards'], 'Almora stay cards missing'
          assert not listing['cards'][0]['availability_verified'], 'Unexpected availability claim'
          tools = {t['name'] for t in rpc('tools/list')['tools']}
          assert {'search_roamwise','get_roamwise_listing','roamwise_enquiry_link','roamwise_capabilities','quote_roamwise_stay','quote_roamwise_shop','browse_roamwise_shop'} <= tools, 'Tool list incomplete'
          caps = rpc('tools/call', {'name':'roamwise_capabilities','arguments':{}})['structuredContent']
          assert caps['modules']['wallet']['publicMcpAccess'] is False, 'Wallet auth boundary failed'
          assert caps['modules']['itineraries']['personalTripsExposed'] is False, 'Private itinerary boundary failed'
          itin = rpc('tools/call', {'name':'search_roamwise','arguments':{'q':'Kumaon','type':'itinerary'}})['structuredContent']
          assert any(i['id']=='kumaon-signature-itinerary' for i in itin['items']), 'Public itinerary missing'
          resource = rpc('resources/list')['resources'][0]['uri']
          view = rpc('resources/read', {'uri':resource})['contents'][0]
          assert view['mimeType'] == 'text/html;profile=mcp-app' and 'RoamWise' in view['text'], 'MCP card UI missing'
          print('MCP, public listings, itinerary sharing and privacy boundaries verified')
          PY
      - name: Roll back to the previous version
        if: failure() && (steps.health.outcome == 'failure' || steps.mcp_smoke.outcome == 'failure')
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 rollback --message "auto-rollback after failed health or MCP smoke" --yes
