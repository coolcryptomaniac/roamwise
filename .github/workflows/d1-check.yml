name: D1 check (read-only)
on:
  push:
    branches: ['diag/d1-check']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: List D1 databases (names only)
        run: |
          npx --yes wrangler@4 d1 list --json > /tmp/d1.json 2>/tmp/d1.err; echo "exit $?"
          python3 -c "import json;d=json.load(open('/tmp/d1.json'));print('DATABASES:',[(x.get('name'),(x.get('uuid') or '')[:8]) for x in d])" || true
          echo "ERR:"; grep -iE "error|auth|permission|code" /tmp/d1.err | head -5 || true
