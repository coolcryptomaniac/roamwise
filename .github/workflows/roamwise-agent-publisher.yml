name: RoamWise Agent — Weekly Rich Guide Publisher
on:
  schedule:
    - cron: '0 5 * * 3'    # Wednesday 10:30 IST
  workflow_dispatch:
    inputs:
      pages:
        description: 'Pages to publish this run'
        default: '1'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Publish new SEO pages
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-2.5-flash
          PAGES_PER_DAY: ${{ github.event.inputs.pages || '1' }}
        run: node agent/publish-daily.js
      - name: Enforce rich-content quality gate
        run: node agent/validate-rich-content.js published.txt
      - name: Regenerate sitemap and related-links for any new pages
        run: |
          npm run sitemap
          npm run related-links
      - name: Commit new pages
        run: |
          git config user.name "roamwise-agent"
          git config user.email "agent@roamwise.co.in"
          git add -A
          git diff --cached --quiet || (git commit -m "🤖 agent: +$(cat published.txt | tr ',' '\n' | grep -c .) SEO pages — $(cat published.txt)" && git push)
