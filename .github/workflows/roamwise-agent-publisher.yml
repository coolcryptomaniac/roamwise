name: RoamWise — Editorial Quality Check
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'content/editorial/**'
      - 'guides/**'
      - 'blog/**'
      - 'tools/build-editorial.js'
      - 'tools/check-editorial.js'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Install dependencies
        run: npm ci
      - name: Verify reviewed editorial collection
        run: npm run content:check
