name: One original merchandise design concept per day
on:
  # First-change smoke test; daily schedule remains recurring. GitHub Actions
  # may be delayed. All changes are concept-only with no checkout permission.
  push:
    branches: [main]
    paths:
      - .github/workflows/merch-daily-review.yml
  schedule:
    - cron: '50 4 * * *' # 10:20 IST, best-effort GitHub schedule
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: roamwise-merch-daily-draft
  cancel-in-progress: false

jobs:
  propose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate exactly one original review-only SKU concept
        run: |
          node --test tests/merch-daily.test.mjs
          node tools/merch-daily.mjs
          git diff --check
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install pinned rasterisation dependencies
        run: python -m pip install --disable-pip-version-check 'cairosvg==2.8.2' 'pillow==11.3.0'
      - name: Build candidate 300-DPI artwork (not Qikink production-validated)
        run: |
          TODAY=$(TZ=Asia/Kolkata date +%F)
          python tools/merch-prepress.py --design-id "daily-$TODAY" --placements back --out-dir build/daily-merch-candidate
      - uses: actions/upload-artifact@v4
        with:
          name: merch-print-candidate-${{ github.run_id }}
          path: build/daily-merch-candidate/
          retention-days: 14
      - name: Auto-commit ONLY non-sellable design previews (no PR permission required)
        run: |
          set -euo pipefail
          TODAY=$(TZ=Asia/Kolkata date +%F)
          node -e "const fs=require('fs');fs.writeFileSync('shop/daily-run-status.json',JSON.stringify({schemaVersion:'1.0.0',dateIST:'$TODAY',lastRunUTC:new Date().toISOString(),purpose:'review-only artwork, no Qikink SKU or checkout activation'},null,2));"
          git config user.name "roamwise-merch-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Do not stage generated 300-DPI binaries, secrets, build/, or customer data.
          git add -- shop/daily-products.json "shop/img/daily-$TODAY.svg" shop/daily-run-status.json
          if git diff --cached --quiet; then
            echo "Already produced today's design: $TODAY"
          else
            git commit -m "design: publish review-only apparel concept for $TODAY"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
          echo "Concept-only inventory updated; Qikink SKU catalogue unchanged."
