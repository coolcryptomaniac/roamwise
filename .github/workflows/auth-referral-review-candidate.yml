name: Auth/referral rules review candidate
on:
  pull_request:
    paths:
      - 'firestore.rules'
      - 'tools/prepare-auth-referral-rules.py'
      - 'tests/prepare-auth-referral-rules.test.py'
      - 'tests/auth-referral-review.test.js'
      - 'tests/auth-referral-emulator.cjs'
      - 'AUTH-REFERRAL-RELEASE-GATE.md'
      - '.github/workflows/auth-referral-review-candidate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review-candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unit test source drift guards
        run: python3 tests/prepare-auth-referral-rules.test.py -v
      - name: Generate full consolidated candidate (DO NOT DEPLOY)
        run: python3 tools/prepare-auth-referral-rules.py --input firestore.rules --output firestore-review.rules
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install emulator and test libraries (CI only)
        run: npm install --no-save firebase-tools firebase @firebase/rules-unit-testing
      - name: Validate actual Firestore allow/deny behavior in isolated demo emulator
        run: npx firebase emulators:exec --project demo-roamwise-rules-review --only firestore "node tests/auth-referral-emulator.cjs"
      - name: Upload review-only rules file
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firestore-review-DO-NOT-DEPLOY
          path: firestore-review.rules
          if-no-files-found: error
          retention-days: 7
