name: Ailon Discovery PR Checks
on:
  pull_request:
    paths:
      - 'index.html'
      - 'js/copilot/core.js'
      - 'js/ui/destination-filmstrip.js'
      - 'js/ui/ailon-world-experience.js'
      - 'design/ailon-world-experience.css'
      - 'tests/roamwise3-integrated-ui.test.js'
      - 'js/ui/destination-media-loader.js'
      - 'media/destination-manifest-v1.json'
      - 'cloudflare/knowledge/**'
      - 'tests/destination-media-approved.test.js'
      - 'tests/approved-knowledge-reader.test.mjs'
      - 'js/ui/home-curated-discovery.js'
      - 'design/destination-filmstrip.css'
      - 'knowledge/**'
      - 'tests/ailon-destination-context.test.cjs'
      - 'tests/destination-filmstrip.test.cjs'
      - '.github/workflows/ailon-discovery-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focused-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install DOM test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate JS syntax
        run: |
          node --check js/copilot/core.js
          node --check js/ui/destination-filmstrip.js
          node --check js/ui/ailon-world-experience.js
          node --check js/ui/destination-media-loader.js
          node --check cloudflare/knowledge/approved-reader.mjs
          node --check js/ui/home-curated-discovery.js
          node --check knowledge/tools/build-cloudflare-seeds.cjs
      - name: Run focused browserless regression tests
        run: node --test tests/ailon-destination-context.test.cjs tests/destination-filmstrip.test.cjs tests/destination-media-approved.test.js tests/approved-knowledge-reader.test.mjs tests/roamwise3-integrated-ui.test.js
      - name: Prepare draft-only knowledge seed
        run: |
          node knowledge/tools/build-cloudflare-seeds.cjs /tmp/roamwise-knowledge-seeds
          test -f /tmp/roamwise-knowledge-seeds/destinations.candidate.sql
          test -f /tmp/roamwise-knowledge-seeds/media-rights-review.json
          if grep -q '"approved_to_upload": true' /tmp/roamwise-knowledge-seeds/media-rights-review.json; then
            echo 'Generated manifest must never auto-approve uploads' >&2
            exit 1
          fi
      - name: Check D1 schema compatibility locally
        run: |
          python3 - <<'PY'
          import sqlite3
          conn=sqlite3.connect(':memory:')
          conn.executescript(open('knowledge/schema/001_public_destination_d1.sql').read())
          conn.executescript(open('knowledge/schema/002_public_media_faq_itinerary.sql').read())
          tables={x[0] for x in conn.execute("SELECT name FROM sqlite_master WHERE type='table'")}
          assert {'public_destination','public_destination_media','public_destination_faq','public_destination_itinerary'} <= tables
          assert conn.execute('PRAGMA foreign_key_check').fetchall()==[]
          conn.execute("INSERT INTO public_destination (id,slug,name,country_iso,status,indexed,created_at,updated_at) VALUES ('tokyo','tokyo','Tokyo','JP','published',1,'2026-11-23','2026-11-23')")
          def insert_media(reviewed_at, rights='licensed'):
              conn.execute("INSERT INTO public_destination_media (id,destination_id,r2_key,public_url,mime_type,alt_text,rights_status,license_proof,size_bytes,status,created_at,reviewed_at,published_at) VALUES (?,?,?,?,?,?,?,?,?,?,?,?,?)",(
                  'tokyo-photo','tokyo','media/tokyo.webp','https://assets.roamwise.co.in/media/tokyo-photo',
                  'image/webp','Tokyo skyline',rights,'approved-licence-ledger-001',65536,'published',
                  '2026-11-23',reviewed_at,'2026-11-23'))
          import sqlite3 as sqlite
          try:
              insert_media(None)
              raise AssertionError('Unreviewed media was allowed to publish')
          except sqlite.IntegrityError:
              pass
          try:
              insert_media('2026-11-22',rights='pending')
              raise AssertionError('Pending-rights media was allowed to publish')
          except sqlite.IntegrityError:
              pass
          insert_media('2026-11-22')
          assert conn.execute("SELECT COUNT(*) FROM public_destination_media WHERE status='published'").fetchone()[0] == 1
          print('D1 public schemas and media publication constraints validated; no external database touched')
          PY
