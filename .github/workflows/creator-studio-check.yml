name: Creator Studio checks

on:
  pull_request:
    paths:
      - 'creators/**'
      - '.github/workflows/creator-studio-check.yml'
  push:
    paths:
      - 'creators/**'
      - '.github/workflows/creator-studio-check.yml'

jobs:
  creator-studio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax
        run: |
          node --check creators/studio.js
          node --check creators/admin.js
      - name: Creator Studio invariants
        run: |
          python - <<'PY'
          from pathlib import Path
          landing=Path('creators/index.html').read_text()
          dash=Path('creators/dashboard.html').read_text()
          studio=Path('creators/studio.js').read_text()
          admin=Path('creators/admin.js').read_text()
          patch=Path('creators/CREATOR-STUDIO-RULES-PATCH.txt').read_text()

          required_landing=["tier:'applied'","refSales:0","refRevenue:0","code:''","creators page (inbound)"]
          for token in required_landing:
              assert token in landing, f'missing CRM application field: {token}'

          assert 'studio.js' in dash and 'studio-v2.js' not in dash
          assert 'csVerifySend' in dash and 'csVerifyReload' in dash
          assert 'emailVerified' in studio
          assert "collection('creatorAccounts').doc(S.user.uid)" in studio
          assert "collection('creatorEarnings').doc(S.user.uid).get()" in studio

          forbidden=[
              "collection('creatorEarnings').doc(S.user.uid).set(",
              "collection('creatorEarnings').doc(S.user.uid).update(",
              "collection('creatorEarnings').doc(S.user.uid).delete("
          ]
          for token in forbidden:
              assert token not in studio, f'creator client must never write verified ledger: {token}'

          assert "collection('creatorAccounts')" in admin
          assert "collection('config').doc('referrers')" in admin
          assert 'Activation blocked: application email does not match the verified Firebase identity.' in admin
          assert "type:'creator'" in admin
          assert 'contentReviews.' in admin

          assert 'match /creatorAccounts/{uid}' in patch
          assert 'request.resource.data.email == request.auth.token.email' in patch
          assert 'request.auth.token.email_verified == true' in patch
          assert 'match /creatorEarnings/{uid}' in patch
          assert 'allow create, update, delete: if isAdmin();' in patch
          assert 'allow read: if isSelf(uid) || isAdmin() || isFinance();' in patch
          print('Creator Studio security/integration invariants OK')
          PY
      - name: No stale runtime
        run: |
          test ! -e creators/studio-v1.js
          test ! -e creators/studio-v2.js
          ! grep -R "studio-v2.js" creators/dashboard.html creators/index.html
