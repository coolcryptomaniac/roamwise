name: Build itinerary preset library

on:
  push:
    branches:
      - feature/itinerary-library-v1.1
    paths:
      - 'tools/itinerary-library/**'
      - '.github/workflows/build-itinerary-library.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deterministic build dependencies
        run: python -m pip install --disable-pip-version-check reportlab==4.2.5 pypdf==5.1.0
      - name: Generate the complete static cache
        env:
          ROAMWISE_ITINERARY_OUT: ${{ github.workspace }}/itinerary-library
          ROAMWISE_ITINERARY_ZIP: /tmp/roamwise-itinerary-library.zip
        run: |
          python tools/itinerary-library/build_presets.py
          python tools/itinerary-library/enhance_v1_1.py
          python tools/itinerary-library/apply_v2_ui.py
      - name: Static integrity checks
        run: |
          node --check itinerary-library/assets/preset-runtime.js
          node --check itinerary-library/assets/preset-carousel-v2.js
          python - <<'PY'
          from pathlib import Path
          import json
          root=Path('itinerary-library')
          manifest=json.loads((root/'manifest.json').read_text())
          htmls=list((root/'presets').glob('*/*.html'))
          pdfs=list((root/'presets').glob('*/*.pdf'))
          assert len(manifest['destinations']) == 48
          assert len(htmls) == 192
          assert len(pdfs) == 192
          assert all(p.stat().st_size > 1000 for p in pdfs)
          assert all('share-stamp' in p.read_text() for p in htmls)
          assert all('local-intel-section' in p.read_text() for p in htmls)
          assert all('preset-carousel-v2.js' in p.read_text() for p in htmls)
          v2=(root/'assets/preset-carousel-v2.js').read_text()
          assert 'scroll-snap-type:x mandatory' in v2
          assert 'openstreetmap.org/export/embed.html' in v2
          print('48 destinations / 192 HTML / 192 PDF / carousel v2: PASS')
          PY
      - name: Commit generated library to this integration branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add itinerary-library
          if git diff --cached --quiet; then
            echo 'Generated library already up to date.'
          else
            git commit -m 'build: generate cinematic itinerary preset library v2 UI'
            git push
          fi
