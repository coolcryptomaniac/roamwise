name: Save RoamWise design catalogue

on:
  push:
    branches: [main]
    paths: ['design/catalogue.json', 'design/catalogue-core.js', 'design/catalogue-seed.js', '.github/workflows/design-catalogue-publish.yml']
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: design-catalogue-production
  cancel-in-progress: false
jobs:
  save:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate catalogue and generated fallback
        run: node tools/design-catalogue.cjs --check
      - name: Save versioned catalogue in existing KV
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID"
          version=$(node -p "require('../design/catalogue.json').version")
          npx --yes wrangler@4 kv key put "design:catalogue:$version" --binding RW_KV --path ../design/catalogue.json --remote
          npx --yes wrangler@4 kv key get "design:catalogue:$version" --binding RW_KV --remote > "$RUNNER_TEMP/design-readback.json"
          node -e "const fs=require('fs'),assert=require('assert/strict');assert.deepEqual(JSON.parse(fs.readFileSync(process.argv[1],'utf8')),require('../design/catalogue.json'));console.log('Design catalogue saved and verified')" "$RUNNER_TEMP/design-readback.json"
