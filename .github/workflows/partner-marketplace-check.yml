name: Partner marketplace checks

on:
  pull_request:
    paths:
      - 'partner/**'
      - 'admin/property-*.js'
      - 'admin/payment-operations.js'
      - 'admin/partner-lifecycle.js'
      - 'worker/handlers/partner-cashfree.js'
      - 'worker/lib/firestore-rest.js'
      - 'firestore.rules'
      - '.github/workflows/partner-marketplace-check.yml'
  push:
    branches: [main]
    paths:
      - 'partner/**'
      - 'admin/property-*.js'
      - 'admin/payment-operations.js'
      - 'admin/partner-lifecycle.js'
      - 'worker/handlers/partner-cashfree.js'
      - 'worker/lib/firestore-rest.js'
      - 'firestore.rules'
      - '.github/workflows/partner-marketplace-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  partner-marketplace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: JavaScript syntax
        run: |
          node --check partner/core.js
          node --check partner/pricing-integrity.js
          node --check partner/app.js
          node --check partner/marketplace.js
          node --check admin/property-prospects-data.js
          node --check admin/property-outreach.js
          node --check admin/payment-operations.js
          node --check admin/partner-lifecycle.js
          node --check worker/handlers/partner-cashfree.js
          node --check worker/lib/firestore-rest.js
      - name: Canonical runtime and trust invariants
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          idx = Path('partner/index.html').read_text()
          js = Path('partner/marketplace.js').read_text()
          css = Path('partner/partner.css').read_text()
          rules = Path('firestore.rules').read_text()
          mou = Path('partner/mou/index.html').read_text()
          audit = Path('partner/audit/index.html').read_text()
          premium = Path('partner/PREMIUM-SUPPLY-STANDARD.md').read_text()

          assert 'partner.css' in idx
          assert 'app.css' not in idx
          assert 'marketplace.css' not in idx
          assert 'marketplace.js' in idx
          assert not re.search(r'marketplace-v\d+', idx, re.I), 'versioned marketplace runtime must not be loaded'

          stale = [
            'partner/marketplace-v2.js','partner/marketplace-v2.css',
            'partner/marketplace-v3.js','partner/marketplace-v3.css',
            'partner/marketplace-v4.js','partner/marketplace-v4.css'
          ]
          for path in stale:
              assert not Path(path).exists(), f'stale runtime remains: {path}'
          for path in ['partner/app.css', 'partner/marketplace.css']:
              assert not Path(path).exists(), f'conflicting CSS layer remains: {path}'

          required = [
            'marketplaceApproved===true',
            'verified:true',
            'paymentSnapshot',
            'emailVerified',
            'getIdToken(true)',
            'safeHttps',
            "bookingVersion:'marketplace'",
            "status:'requested'",
            'HOST STUDIO',
            'rwMarketAck',
            'validPhone',
            'ownerAttestation',
            'walkthroughConsent',
            'HOST TODAY'
            ,'PARTNER LIFECYCLE'
            ,'roamwise_cashfree_after_confirmation'
            ,'RW-PMOU-2026-09-23-V2'
            ,'pricingAudit'
            ,'qualityReview'
          ]
          for token in required:
              assert token in js, f'missing canonical marketplace invariant: {token}'

          assert 'match /partners/{uid}/rooms/{roomId}' in rules
          assert '.data.verified == true' in rules
          assert 'match /roomBookings/{ref}' in rules
          assert 'request.resource.data.guestUid == request.auth.uid' in rules
          assert 'match /paymentDestinations/{id}' in rules
          assert "'pricingAudit'" in rules
          assert "'qualityReview'" in rules
          assert 'RW-PMOU-2026-09-23-V2' in mou
          assert 'Guest-value pass-through' in mou
          assert 'Pricing-integrity audit' in mou
          assert 'Minimum two like-for-like public comparator checks' in mou
          assert 'Save audit &amp; activate property' in audit
          assert 'at least two like-for-like current public comparators' in premium

          assert css.count('{') == css.count('}'), 'unbalanced marketplace CSS braces'
          assert ':focus-visible' in css
          assert '@media(max-width:620px)' in css

          # Never introduce client-side payment secrets/card collection.
          secret_patterns = [
            r'sk_live_[A-Za-z0-9]{12,}',
            r'rzp_(?:live|test)_[A-Za-z0-9]{12,}:[A-Za-z0-9]{8,}',
            r'-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----',
            r'(?:id|name)=["\'][^"\']*(?:card[_-]?number|cvv|cvc|bank[_-]?password|client[_-]?secret)'
          ]
          for pat in secret_patterns:
              assert not re.search(pat, js, re.I), f'possible sensitive client field/secret: {pat}'

          print('Canonical Partner Marketplace checks passed')
          PY
