name: Auth source snapshot
on:
  push:
    paths:
      - '.github/workflows/auth-source-snapshot.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bundle exact source for local review
        run: zip -q auth-source.zip firestore.rules js/boot/auth-init.js js/boot/auth-security.js nmims/index.html index.html tools/prepare-auth-referral-rules.py AUTH-REFERRAL-RELEASE-GATE.md tests/auth-referral-review.test.js tests/auth-security.test.js
      - uses: actions/upload-artifact@v4
        with:
          name: auth-source-snapshot
          path: auth-source.zip
          retention-days: 1
