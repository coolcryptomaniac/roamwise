name: RoamWise growth intelligence — weekly source check

on:
  schedule:
    - cron: '0 4 * * 1' # Monday 09:30 IST; GitHub schedules are best-effort.
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: roamwise-opportunity-radar-weekly
  cancel-in-progress: false

jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check official AI-agent, SDK and distribution signals
        run: node tools/outreach-radar/weekly.cjs
      - name: Update public source-signal feed
        run: |
          set -euo pipefail
          if git diff --quiet -- admin/opportunity-radar-weekly.json; then
            echo 'No source-feed change.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin/opportunity-radar-weekly.json
          git commit -m 'chore: refresh growth intelligence signals'
          git push origin HEAD:main
      - name: Open review-only research digest when there are new signals
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          count="$(node -p 'JSON.parse(require("node:fs").readFileSync("admin/opportunity-radar-weekly.json","utf8")).signals.length')"
          if [ "$count" = 0 ]; then
            echo 'No new official SDK release; no issue.'
            exit 0
          fi
          TITLE="[Opportunity Radar] Growth intelligence signals $(date -u +%Y-%m-%d)"
          gh issue create --title "$TITLE" --body-file opportunity-radar-report.md
