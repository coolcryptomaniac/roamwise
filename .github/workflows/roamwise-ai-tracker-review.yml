name: RoamWise AI Tracker Review

on:
  schedule:
    - cron: '45 3 * * *' # 09:15 IST; GitHub schedules are best effort
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tracker-review:
    runs-on: ubuntu-latest
    env:
      SHEETS_SA: ${{ secrets.ROAMWISE_SHEETS_SERVICE_ACCOUNT_JSON }}
      RANGES: ${{ vars.ROAMWISE_AI_SHEET_RANGES }}
      MAIL_USER: ${{ secrets.MAIL_USERNAME }}
      MAIL_PASS: ${{ secrets.MAIL_APP_PASSWORD }}
      MAIL_TO: ${{ secrets.TO_EMAIL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Configuration status
        run: |
          if [ -z "$SHEETS_SA" ] || [ -z "$RANGES" ] || [ -z "$MAIL_USER" ] || [ -z "$MAIL_PASS" ] || [ -z "$MAIL_TO" ]; then
            echo "AI tracker review is not activated yet."
            echo "Configure the read-only Sheet identity/ranges and private founder-email delivery secrets first."
          else
            echo "AI tracker read-only configuration and private delivery path are present."
          fi

      - name: Run dual-model tracker review
        if: env.SHEETS_SA != '' && env.RANGES != '' && env.MAIL_USER != '' && env.MAIL_PASS != '' && env.MAIL_TO != ''
        env:
          ROAMWISE_SHEETS_SERVICE_ACCOUNT_JSON: ${{ env.SHEETS_SA }}
          ROAMWISE_AI_SHEET_RANGES: ${{ env.RANGES }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_DECISION_MODEL: ${{ vars.OPENAI_DECISION_MODEL }}
          ANTHROPIC_DECISION_MODEL: ${{ vars.ANTHROPIC_DECISION_MODEL }}
        run: node ops/ai-tracker/run.js

      - name: Email private founder review
        if: env.SHEETS_SA != '' && env.RANGES != '' && env.MAIL_USER != '' && env.MAIL_PASS != '' && env.MAIL_TO != ''
        env:
          MAIL_USERNAME: ${{ env.MAIL_USER }}
          MAIL_APP_PASSWORD: ${{ env.MAIL_PASS }}
          TO_EMAIL: ${{ env.MAIL_TO }}
        run: |
          python3 - <<'PY'
          import os, ssl, smtplib
          from email.message import EmailMessage
          from datetime import datetime
          try:
              from zoneinfo import ZoneInfo
              day = datetime.now(ZoneInfo("Asia/Kolkata")).strftime("%d %b %Y")
          except Exception:
              day = datetime.utcnow().strftime("%d %b %Y")
          with open("ai-tracker-report.md", "r", encoding="utf-8") as fh:
              body = fh.read()
          msg = EmailMessage()
          msg["Subject"] = f"RoamWise AI Tracker Review — {day}"
          msg["From"] = os.environ["MAIL_USERNAME"]
          msg["To"] = os.environ["TO_EMAIL"]
          msg.set_content(body)
          with smtplib.SMTP_SSL("smtp.gmail.com", 465, context=ssl.create_default_context()) as smtp:
              smtp.login(os.environ["MAIL_USERNAME"], os.environ["MAIL_APP_PASSWORD"])
              smtp.send_message(msg)
          print("Private AI tracker review emailed successfully; report is not persisted to this public repository.")
          PY

      - name: Remove ephemeral report
        if: always()
        run: rm -f ai-tracker-report.md
