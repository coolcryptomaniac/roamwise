name: Android web parity
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run android:web
      - run: node --test tests/android-web-parity.test.js
      - run: test -f www/shop/checkout.js && test -f www/embed/ailon-tusk.js
