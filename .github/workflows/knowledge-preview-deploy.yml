name: Deploy isolated RoamWise knowledge preview
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type DEPLOY-KNOWLEDGE-PREVIEW after checking the isolated D1/R2 resources and free/paid limits'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: isolated-knowledge-preview
  cancel-in-progress: false
jobs:
  preview:
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'DEPLOY-KNOWLEDGE-PREVIEW'
    runs-on: ubuntu-latest
    environment: knowledge-preview
    env:
      RW_PREVIEW_D1_ID: ${{ vars.RW_PREVIEW_D1_ID }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Verify explicit staging configuration
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          node knowledge/tools/configure-preview.mjs
          node knowledge/tools/prepare-atlas-intake.mjs /tmp/roamwise-atlas-intake
      - name: Apply only additive schemas to the isolated D1 and seed candidates
        run: |
          set -eu
          for schema in knowledge/schema/001_public_destination_d1.sql knowledge/schema/002_public_media_faq_itinerary.sql knowledge/schema/003_editorial_intake.sql knowledge/schema/004_public_place_index.sql /tmp/roamwise-atlas-intake/atlas-candidates.sql; do
            npx --yes wrangler@4 d1 execute roamwise-knowledge-dev --config cloudflare/knowledge/wrangler.preview.generated.toml --remote --file "$schema"
          done
      - name: Deploy dedicated read-only preview (no production domain)
        run: npx --yes wrangler@4 deploy --config cloudflare/knowledge/wrangler.preview.generated.toml
      - name: Clean generated configuration
        if: always()
        run: rm -f cloudflare/knowledge/wrangler.preview.generated.toml
