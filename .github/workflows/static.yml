# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]
  schedule:
    - cron: '17 0 * * *' # 05:47 IST; GitHub schedules may be delayed.

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  actions: read # Restore the preceding successful public source snapshot.
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Prepare daily-source tools
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Restore previous public Kainchi snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/kainchi-previous"
          # No artifact exists on the first run. Failure leaves the checked-in seed as fallback.
          runs=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow static.yml --branch main --status success --limit 5 --json databaseId --jq '.[].databaseId') || runs=""
          for run in $runs; do
            if gh run download "$run" --repo "$GITHUB_REPOSITORY" --name kainchi-source-snapshot --dir "$RUNNER_TEMP/kainchi-previous"; then
              break
            fi
          done
      - name: Collect and validate dated Kainchi updates
        shell: bash
        run: |
          python3 features/kainchi-yatra/tests/daily-feed.test.py
          previous="features/kainchi-yatra/data/daily.json"
          if [ -f "$RUNNER_TEMP/kainchi-previous/daily.json" ]; then
            previous="$RUNNER_TEMP/kainchi-previous/daily.json"
          fi
          python3 features/kainchi-yatra/tools/daily-feed.py --previous "$previous"
          node features/kainchi-yatra/tools/check.cjs
          node --test features/kainchi-yatra/tests/updates.test.cjs
      - name: Retain public source history
        uses: actions/upload-artifact@v7
        with:
          name: kainchi-source-snapshot
          path: features/kainchi-yatra/data/daily.json
          retention-days: 90
          if-no-files-found: error
      - name: Build optimised site (minified JS and CSS)
        # Same files as the repository, with scripts and styles minified. Top-level names are kept, so inline
        # onclick handlers and script order are unchanged. A file that cannot be minified is copied as it is.
        run: |
          npm install --no-save --no-audit --no-fund esbuild@0.25
          node tools/build-dist.cjs _site
          test -f _site/index.html && test -f _site/lite/index.html && test -f _site/sw.js
          for f in _site/app.js _site/rw-config.js _site/js/runtime/freshness.js; do node --check "$f"; done
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          # The optimised copy built above (same content as the repository, smaller scripts)
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
