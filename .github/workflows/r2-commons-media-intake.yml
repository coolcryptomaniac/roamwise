name: Collect permanent RoamWise media candidates
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type COLLECT-PRIVATE-MEDIA to store candidate media in the existing private R2 bucket'
        required: true
  pull_request:
    paths:
      - 'knowledge/tools/collect-commons-media.mjs'
      - 'tests/agent-media-checkout.test.mjs'
      - '.github/workflows/r2-commons-media-intake.yml'
  push:
    branches: [main]
    paths:
      - 'knowledge/tools/collect-commons-media.mjs'
permissions:
  contents: read
concurrency:
  group: roamwise-r2-media-intake
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: node --test tests/agent-media-checkout.test.mjs
  collect:
    needs: test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.confirmation == 'COLLECT-PRIVATE-MEDIA'))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: knowledge-preview
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Collect source-attributed candidates in private R2
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          node knowledge/tools/collect-commons-media.mjs --upload
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: media-intake-review
          path: /tmp/rw-commons-intake/*.json
          retention-days: 30
