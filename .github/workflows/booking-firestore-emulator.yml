name: Booking Firestore Emulator
on:
  pull_request:
    paths:
      - 'js/booking/**'
      - 'tests/booking-firestore-emulator.test.mjs'
      - 'tests/emulator/package.json'
      - '.github/workflows/booking-firestore-emulator.yml'
  workflow_dispatch:
jobs:
  booking-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install isolated emulator dependencies
        run: npm install --prefix tests/emulator --no-audit --no-fund
      - name: Run real Firestore transaction contention test
        run: cd tests/emulator && npx firebase emulators:exec --only firestore --project roamwise-booking-emulator-test 'node --test ../../tests/booking-firestore-emulator.test.mjs' --config ../../firebase.json
