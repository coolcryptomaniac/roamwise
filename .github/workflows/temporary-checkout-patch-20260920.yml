name: Apply scoped checkout and Amritsar fix (temporary)
on:
  push:
    branches:
      - fix/cashfree-auth-amritsar-20260920
    paths:
      - .github/workflows/temporary-checkout-patch-20260920.yml
permissions:
  contents: write
jobs:
  patch:
    if: github.ref == 'refs/heads/fix/cashfree-auth-amritsar-20260920'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Accept raw JSON and encoded Worker service-account JSON
        run: python3 scripts/patch-service-account-format-20260920.py
      - name: Syntax and payment/itinerary regression tests
        run: |
          node --check worker/handlers/cashfree.js
          node --check worker/lib/service-account.js
          node --check js/payments/providers/cashfree-adapter.js
          node --check js/itinerary/build.js
          node --test tests/cashfree-payment.test.js tests/cashfree-auth-amritsar-regression.test.js tests/service-account-format.test.js
      - name: Commit reviewed service-account parser change
        run: |
          git config user.name 'roamwise-patch-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add worker/lib/service-account.js
          git diff --cached --check
          git commit -m 'Accept base64-encoded Worker Firebase service-account JSON'
          git push origin HEAD:fix/cashfree-auth-amritsar-20260920
