name: Validate scoped checkout and Amritsar fix (temporary)
on:
  push:
    branches:
      - fix/cashfree-auth-amritsar-20260920
    paths:
      - .github/workflows/temporary-checkout-patch-20260920.yml
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run checks and print diagnostic checkout toast on failure
        run: |
          node --check worker/handlers/cashfree.js
          node --check js/payments/providers/cashfree-adapter.js
          node --check js/itinerary/build.js
          python3 - <<'PY'
          from pathlib import Path
          t=Path('tests/cashfree-payment.test.js')
          s=t.read_text()
          assert s.count('showToast: () => {},')==1
          t.write_text(s.replace('showToast: () => {},',"showToast: (...args) => console.log('DIAGNOSTIC TOAST:', ...args),"))
          PY
          node --test tests/cashfree-payment.test.js
