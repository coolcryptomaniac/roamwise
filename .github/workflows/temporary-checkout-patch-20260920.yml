name: Apply scoped checkout and Amritsar fix (temporary)
on:
  push:
    branches:
      - fix/cashfree-auth-amritsar-20260920
    paths:
      - .github/workflows/temporary-checkout-patch-20260920.yml
permissions:
  contents: write
jobs:
  patch:
    if: github.ref == 'refs/heads/fix/cashfree-auth-amritsar-20260920'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Apply exact-match edits
        run: python3 scripts/patch-checkout-amritsar-20260920.py
      - name: Syntax and targeted checks
        run: |
          node --check worker/handlers/cashfree.js
          node --check js/payments/providers/cashfree-adapter.js
          node --check js/itinerary/build.js
          node --test tests/cashfree-payment.test.js
      - name: Commit only reviewed source changes
        run: |
          git config user.name 'roamwise-patch-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add worker/handlers/cashfree.js js/payments/providers/cashfree-adapter.js js/itinerary/build.js
          git diff --cached --check
          git commit -m 'Fix misleading payment auth errors and named Amritsar fallback'
          git push origin HEAD:fix/cashfree-auth-amritsar-20260920
