name: Platform V5 guardrails

on:
  push:
    branches: [platform-v5]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * 1'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate Platform V5 JavaScript
        run: |
          node --check platform-v5/atlas-shinobi.js
          node --check platform-v5/audio-only.js
          node --check platform-v5/learning-consent.js
          node --check platform-v5/performance.js
          node --check platform-v5/cinematic-map-v51.js
          node --check payments/provider-registry.mjs
          node --check payments/router-core.mjs
          node --check payments/webhook-verify.mjs
          node --check payments/worker.mjs
          node --check rw-config.js
          node --test tests/*.test.js

      - name: Guard canonical startup quality
        run: |
          python3 - <<'PY'
          from pathlib import Path

          atlas = Path('platform-v5/atlas-shinobi.js').read_text()
          config = Path('rw-config.js').read_text()
          app_css = Path('app.css').read_text()

          assert Path('app-base.css').exists(), 'canonical base stylesheet copy missing'
          assert '@import url("./app-base.css")' in app_css, 'root stylesheet must preserve canonical base CSS'
          assert '#intro,.intro{display:none!important' in app_css, 'legacy splash must be hidden at first paint'

          assert "ROOT_ID = 'rwOpening'" in atlas, 'canonical opening root missing'
          assert 'src="assets/roamwise-opening.mp4"' in atlas, 'approved MP4 must be the canonical film'
          assert 'src="/assets/roamwise-opening.mp4"' not in atlas, 'canonical film must use a relative path (absolute path 404s outside domain-root contexts)'
          assert '/assets/roamwise-opening-poster.png' not in atlas, 'removed loading photo returned'
          assert '<img' not in atlas, 'opening must not render a loading photo'
          assert not Path('assets/roamwise-opening-poster.png').exists(), 'removed loading photo still shipped'
          assert 'conic-gradient' in atlas and 'rw-video-failed' in atlas, 'CSS video fallback missing'
          assert 'rw-audio-gate' in atlas and 'RWAudio.play()' in atlas, 'opening audio gate missing'
          assert '@media (min-width:900px)' in atlas, 'desktop-responsive opening layout missing'
          assert 'prefers-reduced-motion:reduce' in atlas, 'reduced-motion fallback missing'
          assert 'rwIntroThunder' in atlas and 'rwIntroRain' in atlas and 'rwIntroMatrix' in atlas, 'cinematic atmosphere regressed'
          assert 'rwShinobiGlobe' in atlas and 'rw-shinobi' in atlas, 'moving red-cloak shinobi overlay missing'
          assert 'rwFlameTip' in atlas and 'rwEmber' in atlas and 'rw-fire' in atlas, 'fire/spark loading bar missing'
          assert 'if (document.body) mount();' in atlas, 'opening must mount immediately when body exists'
          assert 'animateMotion' not in atlas and 'GSHHS-derived coastline geometry' not in atlas, 'retired vector atlas returned'

          assert 'cinematicDurationMs: 6800' in config, 'opening duration changed unexpectedly'
          assert 'window.__RW_INTRO_SHOULD_SHOW' in config, 'pre-app intro hand-off missing'
          assert "document.getElementById('intro')" in config and 'legacy.remove()' in config, 'legacy splash node must be removed synchronously'
          assert '#intro,.intro{display:none!important' in config, 'preboot splash suppression missing'
          audio_load = "load('platform-v5/audio-only.js', true)"
          opening_load = "load('platform-v5/atlas-shinobi.js', true)"
          assert 's.async=false' in config and audio_load in config and opening_load in config, 'ordered audio/opening modules missing'
          assert config.index(audio_load) < config.index(opening_load), 'audio must load before the opening'
          assert "sessionStorage.setItem('rw_intro','1')" in config, 'show-once-per-session behavior missing'
          print('Canonical startup guardrails OK')
          PY

      - name: Build canonical full-replace Firestore rules
        run: python3 scripts/apply-platform-rules-v17.py

      - name: Check canonical rules invariants
        run: |
          grep -q 'STABLE BUILD v17.0 / Platform V5' firestore.rules
          test "$(grep -c 'match /aiLearningSamples/{id}' firestore.rules)" -eq 1
          test "$(grep -c 'match /capTable/{id}' firestore.rules)" -eq 1
          test "$(grep -c 'match /crowdSignals/{id}' firestore.rules)" -eq 1
          grep -q 'v16: browser checks are UX only' firestore.rules
          grep -q 'CREATOR STUDIO V4 BEGIN' firestore.rules

      - name: Check no secret-looking values were committed to V5 modules
        run: |
          ! grep -RIE '(sk-[A-Za-z0-9]{20,}|ghp_[A-Za-z0-9]{20,}|xox[baprs]-[A-Za-z0-9-]{10,})' platform-v5 payments || false

      - name: Commit canonical rules when generator changed them
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        run: |
          if git diff --quiet -- firestore.rules; then
            echo 'firestore.rules already canonical'
            exit 0
          fi
          git config user.name 'roamwise-platform-bot'
          git config user.email 'bot@roamwise.co.in'
          git add firestore.rules
          git commit -m 'Platform V5: regenerate canonical Firestore v17 rules'
          git push
